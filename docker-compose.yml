services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gapo_slidegen
      POSTGRES_USER: gapo
      POSTGRES_PASSWORD: gapo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapo -d gapo_slidegen"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gapo-slidegen-postgres:/var/lib/postgresql/data

volumes:
  gapo-slidegen-postgres:

name: gapo-slidegen

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: slidegen
      POSTGRES_USER: slidegen
      POSTGRES_PASSWORD: slidegen
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidegen -d slidegen"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:

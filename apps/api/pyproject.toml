[project]
name = "gapo-slidegen-api"
version = "0.1.0"
description = "FastAPI service and document ingestion boundary for Gapo SlideGen"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.18.5",
  "email-validator==2.3.0",
  "fastapi==0.139.2",
  "pydantic-settings==2.14.2",
  "psycopg[binary]==3.3.4",
  "pypdf==6.13.3",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "pwdlib[argon2]==0.3.0",
  "sqlalchemy==2.0.51",
  "uvicorn==0.51.0",
  "google-genai==2.13.0",
  "httpx==0.28.1",
  "redis>=8.1.0",
]

[dependency-groups]
dev = [
  "httpx2==2.9.0",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

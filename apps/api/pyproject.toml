[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gapo-slidegen-api"
version = "0.1.0"
description = "FastAPI backend for Gapo SlideGen"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "google-genai>=1.28,<2",
  "httpx>=0.28,<1",
  "openai>=1.99,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
